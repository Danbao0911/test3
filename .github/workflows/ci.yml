name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: test3
          POSTGRES_PASSWORD: test3
          POSTGRES_DB: test3_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test3 -d test3_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test3:test3@127.0.0.1:5432/test3_ci
      TEST_DATABASE_URL: postgresql://test3:test3@127.0.0.1:5432/test3_ci
      APP_MODE: demo
      AUTH_COOKIE_NAME: test3_session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
