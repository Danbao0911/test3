services:
  db:
    image: postgres:17.6-alpine
    container_name: test3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test3
      POSTGRES_PASSWORD: test3
      POSTGRES_DB: test3
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - test3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test3 -d test3"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  test3_postgres_data:
